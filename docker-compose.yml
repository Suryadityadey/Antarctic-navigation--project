version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ml-service:
    build: ./backend/ml-service
    ports:
      - "8000:8000"

  gateway:
    build: ./backend/gateway
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      ML_SERVICE_URL: http://ml-service:8000
      MONGO_URI: mongodb://mongo:27017/antarctic_nav
    depends_on:
      - mongo
      - ml-service

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:5000
    depends_on:
      - gateway

volumes:
  mongo_data:
